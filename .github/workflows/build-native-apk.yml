name: Build Native APK

on:
  push:
    branches:
      - android-4.4.2
      - kotlin-rewrite
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apk:
    name: Build Kotlin native APK
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: app/build/outputs/apk/release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*= ([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify no bundled native libraries
        run: |
          UNIVERSAL="$OUTPUT_DIR/app-universal-release.apk"
          if [ ! -f "$UNIVERSAL" ]; then
            UNIVERSAL="$OUTPUT_DIR/app-release.apk"
          fi
          if unzip -l "$UNIVERSAL" 'lib/*/*.so' 2>/dev/null | rg -q '\.so$'; then
            echo "Unexpected native libraries in APK:"
            unzip -l "$UNIVERSAL" 'lib/*/*.so'
            exit 1
          fi
          echo "OK: no lib/*/*.so in release APK"

      - name: Prepare APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          shopt -s nullglob
          apks=("$OUTPUT_DIR"/app-*-release.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK found in $OUTPUT_DIR"
            find app/build/outputs -name '*.apk' -print
            exit 1
          fi
          for apk in "${apks[@]}"; do
            abi="${apk#"$OUTPUT_DIR"/app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "$OUTPUT_DIR/flauncher-native-${abi}-${VERSION_NAME}-release.apk"
          done
          ls -lh "$OUTPUT_DIR"/flauncher-native-*-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flauncher-native-${{ steps.version.outputs.version_name }}-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/flauncher-native-*-${{ steps.version.outputs.version_name }}-release.apk
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          TAG_NAME="v${VERSION_NAME}"
          NOTES="Automated native build from \`${GITHUB_REF_NAME}\` (run #${GITHUB_RUN_NUMBER}, versionCode ${VERSION_CODE}). Unsigned build."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$OUTPUT_DIR"/flauncher-native-*-"${VERSION_NAME}"-release.apk --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Native ${VERSION_NAME}" \
              --notes "$NOTES" \
              "$OUTPUT_DIR"/flauncher-native-*-"${VERSION_NAME}"-release.apk
          fi
