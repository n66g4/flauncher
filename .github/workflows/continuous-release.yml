name: Build APK

on:
  push:
    branches:
      - master
      - chinese-localization
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    env:
      OUTPUT_DIR: build/app/outputs/flutter-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Verify environment
        run: |
          java --version
          flutter --version
          flutter doctor -v

      - name: Set version variables
        id: set_version_variables
        run: |
          cat version_numbers >> "$GITHUB_OUTPUT"
          export "$(grep -v '^#' version_numbers | xargs)"
          echo "FULL_VERSION_NUMBER=$(date '+%Y.%m').$(printf '%03d' "$MONTH_VERSION_NUMBER")" >> "$GITHUB_OUTPUT"

      - name: Setup signing keystore
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_FILE_BASE64" ]; then
            echo -n "$KEYSTORE_FILE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "USE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "No keystore secret configured, release APK will use debug signing."
            echo "USE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          FLAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.FLAUNCHER_KEYSTORE_PASSWORD }}
          FLAUNCHER_SIGNING_KEY_ALIAS: ${{ secrets.FLAUNCHER_SIGNING_KEY_ALIAS }}
          FLAUNCHER_SIGNING_KEY_PASSWORD: ${{ secrets.FLAUNCHER_SIGNING_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.set_version_variables.outputs.BUILD_NUMBER }}
          FULL_VERSION_NUMBER: ${{ steps.set_version_variables.outputs.FULL_VERSION_NUMBER }}
        run: |
          flutter --no-color build apk --release \
            --build-number "$BUILD_NUMBER" \
            --build-name="$FULL_VERSION_NUMBER"
          shopt -s nullglob
          for apk in "$OUTPUT_DIR"/app-*-release.apk; do
            abi="${apk#"$OUTPUT_DIR"/app-}"
            abi="${abi%-release.apk}"
            mv "$apk" "$OUTPUT_DIR/flauncher-${abi}-release.apk"
          done
          if [ -f "$OUTPUT_DIR/app-release.apk" ]; then
            mv "$OUTPUT_DIR/app-release.apk" "$OUTPUT_DIR/flauncher-universal-release.apk"
          fi
          ls -lh "$OUTPUT_DIR"/flauncher-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flauncher-${{ steps.set_version_variables.outputs.FULL_VERSION_NUMBER }}-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/flauncher-*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH_VERSION_NUMBER: ${{ steps.set_version_variables.outputs.MONTH_VERSION_NUMBER }}
          FULL_VERSION_NUMBER: ${{ steps.set_version_variables.outputs.FULL_VERSION_NUMBER }}
        run: |
          TAG_NAME="v${FULL_VERSION_NUMBER}"
          BRANCH_NAME="${GITHUB_REF_NAME}"
          NOTES="Automated build from \`${BRANCH_NAME}\` (run #${GITHUB_RUN_NUMBER})."
          if [ "${USE_SIGNING}" != "true" ]; then
            NOTES="${NOTES} Unsigned build (debug signing)."
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$OUTPUT_DIR"/flauncher-*.apk --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Release #${MONTH_VERSION_NUMBER} $(date '+%B %Y') (${FULL_VERSION_NUMBER})" \
              --notes "$NOTES" \
              "$OUTPUT_DIR"/flauncher-*.apk
          fi
